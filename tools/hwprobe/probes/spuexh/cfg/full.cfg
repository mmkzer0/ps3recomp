# Full: every block of every domain and op, heavy conversion scales included (9988 jobs, 79026 hashes), plus special probe A (the DP compares), which the sweep needs for dfceq/dfcmeq/dfcgt/dfcmgt/dftsv.
# preset= must be the first sweep key (it resets the sweep settings); the keys below are the operator's declaration of the
# console, which the probe cannot read: fill in fw_version, fw_type and console_model so they reach the result header.
preset=full
special_a=1
special_b=0
pad=0
hold_s=10
tag=full
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish\n# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
