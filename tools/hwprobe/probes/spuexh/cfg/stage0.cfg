# Stage 0: the first run on a console after the blockers were fixed (RUN.md section 4). One SPU, integer-only
# domains and ops: no DP, no float, no special probes, block 0 of everything (smoke stride). Proves the SPU
# program, the thread groups, the exception queue, the result file and bounded termination on known integer code.
# preset= must be the first sweep key (it resets the sweep settings); the keys below are the operator's declaration of the
# console, which the probe cannot read: fill in fw_version, fw_type and console_model so they reach the result header.
preset=smoke
spus=1
# integer domains only: the float/DP operand pools (fpool*, frand*, fnear*, fovf2, dpool*, drand*, dnear*, dfrds) stay out
doms=byte2,half2,wcnt,qcnt,qcnta,h16ll,h16hh,h16hl,wpool2,wrand,w32,w32e,w32o,bits16,immb,immh,immw,fsmbi,shufb_pos,shufb_rand,shufb_all
# every float/DP op is skipped by name (also the ones inside the mixed word pools w32/wrand/wpools2)
skip_ops=fa,fm,fma,fms,fnms,fs,dfs,fesd,fred,fceq,fcgt,fcmeq,fcmgt,fi,frest,frsqest,dfa,dfm,dfma,dfms,dfnms,dfnma,frds,cflts*,cfltu*,csflt*,cuflt*
special_a=0
special_b=0
sweep=1
pad=0
hold_s=10
tag=stage0
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish\n# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
