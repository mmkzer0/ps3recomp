# The ops no independent oracle exists for, and the conversions, over every block: frest frsqest fi (estimates) and
# cflts/cfltu/csflt/cuflt at the 12 scales. No special probes.
preset=full
doms=w32,fi
ops=frest,frsqest,fi,cflts*,cfltu*,csflt*,cuflt*
special_a=0
special_b=0
pad=0
hold_s=10
tag=priority
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish\n# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
