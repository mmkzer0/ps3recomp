# Only the two special probes (no sweep): does the SPU accept dfceq/dfcmeq/dfcgt/dfcmgt/dftsv, and which of the 784
# prefixes the toolkit leaves undecoded does the hardware execute? A few minutes.
preset=smoke
sweep=0
special_a=1
special_b=1
pad=0
hold_s=10
tag=special
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish\n# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
