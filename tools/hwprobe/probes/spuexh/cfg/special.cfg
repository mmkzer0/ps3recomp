# Only the two special probes (no sweep): probe A re-checks that the SPU does not execute dfceq/dfcmeq/dfcgt/dfcmgt/dftsv, and
# probe B asks which of the 789 prefixes the toolkit leaves undecoded (the five of probe A among them) the hardware executes. A few minutes.
preset=smoke
sweep=0
special_a=1
special_b=1
pad=0
hold_s=10
tag=special
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish\n# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
