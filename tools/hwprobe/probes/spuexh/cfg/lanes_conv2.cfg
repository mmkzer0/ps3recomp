# Lanes of the conversions, second round: lanes_conv.cfg (r007) showed cflts/cfltu at I8 scale 0, 1 and 2 differing from the
# toolkit per lane while 173 agreed. The sweep only has twelve scales; this config dumps the first 256 calls of w32 block 0
# at scales in between and around, to find where the rule changes (the instruction takes any I8 0..255, RUN.md "Lanes").
# cflts at 3 10 20 30 40 44 45 46 47 60 100 125 and cfltu at 3 45 46 47: 16 entries, the maximum of one configuration.
# No sweep and no special probes, one SPU. preset= must be the first sweep key (it resets the sweep settings); the keys at the
# end are the operator's declaration of the console, which the probe cannot read: fill in fw_version, fw_type and console_model.
preset=smoke
sweep=0
special_a=0
special_b=0
spus=1
# every lanes launch is bounded by this limit (a lanes job runs for milliseconds)
launch_timeout_ms=60000
lanes=cflts@3:w32:0:256
lanes=cflts@10:w32:0:256
lanes=cflts@20:w32:0:256
lanes=cflts@30:w32:0:256
lanes=cflts@40:w32:0:256
lanes=cflts@44:w32:0:256
lanes=cflts@45:w32:0:256
lanes=cflts@46:w32:0:256
lanes=cflts@47:w32:0:256
lanes=cflts@60:w32:0:256
lanes=cflts@100:w32:0:256
lanes=cflts@125:w32:0:256
lanes=cfltu@3:w32:0:256
lanes=cfltu@45:w32:0:256
lanes=cfltu@46:w32:0:256
lanes=cfltu@47:w32:0:256
pad=0
hold_s=10
tag=lanes_conv2
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish
# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
