# fesd on w32e block 0: the sweep's block hash differs from the toolkit's, but lanes_conv.cfg (r007) found calls 0..255 equal.
# lanesum hashes the block in chunks of 4096 calls (the sweep's hash function restricted to the chunk: 256 chunks of the
# 2^20 calls of the block); lanesum_compare.py sets them against the toolkit's chunk hashes and lists the differing chunks.
# Then dump the calls of a differing chunk with a lanes= line (lanes=OP:DOMAIN:BLOCK[:COUNT[:START]], START counted from the start of
# the block, at most 1024 calls per entry, 16 entries): copy the template below, set START, run the config again, and read
# the result with lanes_compare.py. Chunk k of 4096 starts at call k*4096; a chunk takes four lanes entries of 1024.
# No sweep and no special probes, one SPU. preset= must be the first sweep key (it resets the sweep settings); the keys at the
# end are the operator's declaration of the console, which the probe cannot read: fill in fw_version, fw_type and console_model.
preset=smoke
sweep=0
special_a=0
special_b=0
spus=1
# every launch is bounded by this limit (a lanesum job over one block runs for well under a second)
launch_timeout_ms=60000
lanesum=fesd:w32e:0:4096
# lanes=fesd:w32e:0:1024:0
# lanes=fesd:w32e:0:1024:1024
pad=0
hold_s=10
tag=lanesum_fesd
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish
# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
