# Lanes of the conversions: the sweep found that the hardware disagrees with the toolkit for cflts/cfltu at I8 = 0, 1, 2 on raw
# 32-bit word inputs (domain w32) and for fesd on w32e (block 0). Hashes alone cannot say how, so this config dumps the operands,
# the patched immediate and the result of the first calls of those blocks (RUN.md "Lanes"; lanes_compare.py sets them against the
# toolkit's model). The 173 entries are the control: that scale agreed in the sweep, so its lanes must be equal everywhere.
# No sweep and no special probes, one SPU. preset= must be the first sweep key (it resets the sweep settings); the keys at the
# end are the operator's declaration of the console, which the probe cannot read: fill in fw_version, fw_type and console_model.
preset=smoke
sweep=0
special_a=0
special_b=0
spus=1
# every lanes launch is bounded by this limit (a lanes job runs for milliseconds)
launch_timeout_ms=60000
lanes=cflts@0:w32:0:256
lanes=cflts@1:w32:0:256
lanes=cflts@2:w32:0:256
lanes=cfltu@0:w32:0:256
lanes=cfltu@1:w32:0:256
lanes=cfltu@2:w32:0:256
lanes=cflts@173:w32:0:64
lanes=cfltu@173:w32:0:64
lanes=fesd:w32e:0:256
pad=0
hold_s=10
tag=lanes_conv
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish
# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
