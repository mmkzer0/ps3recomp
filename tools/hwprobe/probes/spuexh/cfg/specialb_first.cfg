# Special probe B, first word only: exactly one word, the first undecoded prefix (0x004) with the all-zero operand
# pattern. The batches after it (4 prefixes zero, 16 prefixes zero, then the random patterns) widen
# special_b_from/special_b_count/special_b_patterns - RUN.md section 4 has the recommended sequence. A SPECB_TRY
# row is flushed before each word runs, so a lost run names the word that was being attempted.
# preset= must be the first sweep key (it resets the sweep settings); the keys below are the operator's declaration of the
# console, which the probe cannot read: fill in fw_version, fw_type and console_model so they reach the result header.
preset=smoke
sweep=0
special_a=0
special_b=1
special_b_from=0
special_b_count=1
special_b_patterns=zero
pad=0
hold_s=10
tag=specb_w1
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# screen=0: the on-screen status can wait unboundedly in the RSX label path of common/hwprobe_ui.c (and rsxFinish\n# at shutdown); the result file is the record, so the console stages run without the screen.
screen=0
