# Special probe B: the first prefix (0x004), zero pattern, one-prefix batch.
# special_b_count counts prefixes. To retry an incomplete prefix, use its SPECB_TRY index as the inclusive start.
# Both-mode retries that prefix from zero, then runs its random pattern; no attempted word is skipped.
# preset= must be the first sweep key (it resets the sweep settings); the keys below are the operator's declaration of the
# console, which the probe cannot read: fill in fw_version, fw_type and console_model so they reach the result header.
preset=smoke
sweep=0
special_a=0
special_b=1
special_b_from=0
special_b_count=1
special_b_patterns=zero
b_timeout_ms=600
pad=0
hold_s=10
tag=specb_first
fw_version=4.81
fw_type=CEX REBUG Cobra 7.5
console_model=CECHC04
# Disable drawing because the on-screen RSX label path can wait unboundedly; use the flushed result file for progress.
screen=0
