# CI for this fork's `dev` branch. It runs only when someone dispatches it:
#
#   gh workflow run dev-ci.yml --ref dev [-f stress=true]
#
# The upstream workflows inherited by the fork (linux, macos, windows,
# linux-vulkan, release) trigger on push, pull_request and tags. They are
# disabled in the fork's Actions settings
# (`gh workflow disable <name>`), so nothing runs on its own. A workflow_dispatch
# workflow has to exist on the default branch, which is why `dev` is the
# default.
#
# Tiers come from CTest labels (CMakeLists.txt, "Tests"):
#   - the dev, release and asan presets run `t0`;
#   - the tsan preset runs `tsan`;
#   - `stress` runs on request.
name: dev-ci

on:
  workflow_dispatch:
    inputs:
      stress:
        description: Also run the stress tier (release preset)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No game or firmware material in the tree
        run: python3 tools/check_hygiene.py --repo . --tracked

  macos:
    name: macos-15 arm64 (${{ matrix.preset }})
    runs-on: macos-15
    timeout-minutes: ${{ inputs.stress && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, asan, tsan, fiber-aarch64-asan, fiber-aarch64-tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja sdl2 glslang spirv-cross llvm lld
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        # The dev configure preset's tier-filtered test preset is `t0`; every
        # other preset has a test preset of its own name.
        run: ctest --preset ${{ matrix.preset == 'dev' && 't0' || matrix.preset }}
      - name: Stress tier
        if: inputs.stress && matrix.preset == 'release'
        run: ctest --test-dir build/release -L '^stress$' --output-on-failure

  tool-suites:
    name: macos-15 arm64 (tools/test_*.py)
    runs-on: macos-15
    # A Metal fixture stuck in the runner's GPU stack ignores its own
    # subprocess timeout (seen on 2026-10-26, run 40297372432); bound the job
    # instead of letting it hold a macOS runner for the 6 h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # test_pad_file_reports.py (v0.18.0) builds its SDL HLE fixture with
        # sdl2-config. A missing dependency must fail the job, never skip.
        run: brew install sdl2
      - name: Run the tool and lifter suites
        env:
          CI: "1"          # a skipped conformance run fails instead of passing
        run: |
          set -e
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t"
          done
      - name: NID annotations state the NID their function computes
        # Registration computes every NID from the function name, so a stale
        # `/* NID: 0x... */` comment is invisible to the build and wrong to
        # whoever reads it as evidence. cellGcmSys carried 33 wrong ones.
        run: python3 tools/check_nid_comments.py libs

  linux:
    # Two compilers on the same libstdc++. AGENTS.md promises GCC parity, and
    # GCC differs from clang where it counts here, for example it still
    # warns on a (void) discard of a warn_unused_result call (#26).
    name: ubuntu-24.04 x86_64 (dev, ${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: clang, cxx: clang++ }
          - { cc: gcc-14, cxx: g++-14 }
    steps:
      - uses: actions/checkout@v4
      # Downloaded .debs are cached, so a slow mirror costs only the index
      # update. Bump the key suffix when the package list changes; until then
      # a stale cache only means the new packages are downloaded.
      - name: Restore the apt package cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-v1
      - name: Install dependencies
        id: apt-install
        # The runners' Ubuntu mirror is at times very slow or hangs: on
        # 2026-10-26 the same install took 5 min (run 40299155562) and more
        # than 30 min (runs 40302851162, 40307082211), and on 2026-10-27 one
        # job sat in it for 25+ min (run 40507665836). Each attempt is bounded
        # and retried instead of waiting out one hung connection; three failed
        # attempts fail the job. The step bound stays as the outer limit.
        timeout-minutes: 40
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          APT="$APT -o Dir::Cache::Archives=$HOME/apt-archives"
          PKGS="ninja-build libsdl2-dev clang lld g++-14 glslang-dev glslang-tools spirv-tools
                libspirv-cross-c-shared-dev gcc-powerpc64-linux-gnu g++-powerpc64-linux-gnu
                binutils-powerpc64-linux-gnu"
          ok=0
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get $APT update &&
               sudo timeout 300 apt-get $APT install -y $PKGS; then
              ok=1; break
            fi
            echo "::warning::apt attempt $attempt failed or timed out"
            sleep 15
          done
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          test "$ok" = 1
      - name: Save the apt package cache
        if: steps.apt-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-v1
      - name: Configure
        # The synthetic synlib variants require the PowerPC64 cross toolchain
        # installed above: a missing one is a configure error here, never a
        # silently skipped suite.
        run: CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} cmake --preset dev -DPS3RECOMP_DIFF_SYNTHETIC_REQUIRED=ON
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset t0
